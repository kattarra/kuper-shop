<title>KuperShop</title>
<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:90px}
  header{position:sticky;top:0;z-index:10;background:#14171d;border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}

  .avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;overflow:hidden;flex-shrink:0;border:2px solid var(--border)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  header h1{font-size:17px;margin:0;letter-spacing:.5px} header h1 span{color:var(--accent)}
  .tg-link{font-size:12px;color:var(--muted);text-decoration:none}
  .cart-btn{position:relative;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap}
  .cart-btn .badge{position:absolute;top:-6px;right:-6px;background:var(--accent);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .promos{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none} .promos::-webkit-scrollbar{display:none}
  .promo{flex-shrink:0;width:240px;height:120px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(135deg,#2b3a67,#1a1d24);border:1px solid var(--border);display:flex;align-items:flex-end;padding:12px;cursor:pointer}
  .promo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
  .promo .promo-text{position:relative;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.75));width:100%;margin:-12px;padding:12px;font-size:13px;line-height:1.3;font-weight:600}
  .cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none} .cats::-webkit-scrollbar{display:none}
  .cat{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted);cursor:pointer}
  .cat.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{height:110px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;text-align:center;padding:8px;color:#fff;letter-spacing:.5px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
  .card-body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
  .name{font-size:13px;line-height:1.3;min-height:34px}
  .stock{font-size:11px;color:var(--green)} .stock.out{color:var(--danger)}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .price{font-size:15px;font-weight:700;color:var(--green)}
  .add{background:var(--accent);border:none;color:#fff;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer}
  .add:disabled{background:var(--card2);color:var(--muted);cursor:not-allowed}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none} .overlay.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:18px 18px 0 0;max-height:90vh;display:none;flex-direction:column} .sheet.show{display:flex}
  .sheet-head{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center} .sheet-head h2{font-size:17px;margin:0}
  .close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer}
  .sheet-body{overflow-y:auto;padding:12px 16px;flex:1}
  .ci{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center} .ci .ci-name{flex:1;font-size:13px;line-height:1.3} .ci .ci-price{font-size:13px;color:var(--green);font-weight:600;white-space:nowrap}
  .qty{display:flex;align-items:center;gap:8px} .qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:15px;cursor:pointer} .qty span{min-width:18px;text-align:center;font-size:13px}
  .delivery{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:14px} .delivery input{width:18px;height:18px;accent-color:var(--accent)}
  .totals{padding:12px 16px;border-top:1px solid var(--border);font-size:14px} .totals .line{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--muted)} .totals .line.total{color:var(--text);font-size:17px;font-weight:700;margin-top:8px}
  .sheet-foot{padding:12px 16px 20px} .btn-primary{width:100%;background:var(--accent);border:none;color:#fff;padding:15px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer} .btn-primary:disabled{background:var(--card2);color:var(--muted)}
  .btn-secondary{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:13px;border-radius:12px;font-size:15px;cursor:pointer;margin-top:8px}
  .field{margin-bottom:12px} .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px} .field input,.field textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;font-size:15px;font-family:inherit} .field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .thanks{text-align:center;padding:24px 16px} .thanks .ok{font-size:48px;margin-bottom:10px} .thanks h2{margin:0 0 8px} .thanks p{color:var(--muted);font-size:14px;line-height:1.5}
  .reqs{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:14px;margin:16px 0;text-align:left;font-size:14px;line-height:1.6} .reqs b{color:var(--accent)}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none} .toast.show{opacity:1}
  .admin-sec{margin-bottom:18px;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--card)} .admin-sec h3{margin:0 0 10px;font-size:14px;color:var(--gold)} .admin-sec .field:last-child{margin-bottom:0}
  .promo-admin{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card2)} .promo-admin img{width:60px;height:40px;object-fit:cover;border-radius:6px;background:#000} .promo-admin .pa-text{flex:1;font-size:12px;line-height:1.3;color:var(--muted)} .promo-admin .pa-del{background:var(--danger);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
  .search-wrap{padding:0 16px 12px}.search-wrap input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);font:inherit;outline:none}.search-wrap input:focus{border-color:var(--accent)}

  body.age-gate-open{overflow:hidden}
  .age-gate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(7,9,13,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .age-gate[hidden]{display:none}
  .age-card{width:100%;max-width:420px;padding:30px 24px;border:1px solid var(--border);border-radius:22px;background:var(--card);text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.45)}
  .age-mark{width:76px;height:76px;margin:0 auto 18px;border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:27px;font-weight:800;letter-spacing:-1px}

  .age-card p{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.55}

  .age-decline{background:var(--card2);border:1px solid var(--border);color:var(--text)}

  .admin-login input{width:100%;padding:13px;margin:7px 0 12px;border:1px solid var(--border);border-radius:10px;background:var(--card2);color:var(--text);font:inherit}

  .admin-order select{padding:9px;border:1px solid var(--border);border-radius:9px;background:var(--card2);color:var(--text);font:inherit;max-width:100%}
  .admin-order p{margin:5px 0;font-size:13px;line-height:1.4;overflow-wrap:anywhere}
  .admin-order-items{margin:9px 0;padding:9px;border-radius:9px;background:var(--card2);font-size:13px;line-height:1.55}

  .admin-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}
  .admin-tabs button{padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--card2);color:var(--text);font:inherit}

  .admin-product-actions button.secondary{background:var(--card2);border:1px solid var(--border);color:var(--text)}
  .admin-add{padding:14px;border:1px dashed var(--border);border-radius:13px;margin:12px 0 18px}
  .admin-add h3{margin:0 0 10px;color:var(--gold);font-size:14px}
  .admin-count{font-size:12px;color:var(--muted);margin:8px 0}

  .crop-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.82)}\n  .crop-dialog{width:min(100%,420px);max-height:90vh;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 20px 60px #0008}\n  .crop-head{display:flex;justify-content:space-between;align-items:center;font-size:17px}.crop-head button{background:none;border:0;color:var(--text);font-size:26px}\n  .crop-hint{font-size:13px;color:var(--muted);line-height:1.45;margin:10px 0 14px}.crop-frame{width:100%;aspect-ratio:3/2;background:#151820;border-radius:12px;overflow:hidden;touch-action:none}.crop-frame canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.crop-zoom{display:flex;align-items:center;gap:12px;margin:14px 0}.crop-zoom label{font-size:13px;white-space:nowrap}.crop-zoom input{flex:1;min-width:0}.crop-preview-label{font-size:12px;color:var(--muted);margin:12px 0 7px}.crop-card-preview{width:calc(50% - 5px);max-width:190px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}.crop-card-image{aspect-ratio:3/2;background:#151820}.crop-card-image canvas{width:100%;height:100%;display:block}.crop-card-lines{padding:8px;display:grid;gap:6px}.crop-card-lines span{height:6px;border-radius:4px;background:var(--border)}.crop-card-lines span:last-of-type{width:65%}.crop-card-lines b{font-size:13px;color:var(--green)}.crop-actions{display:flex;gap:8px;margin-top:16px}.crop-actions button{flex:1;border:0;border-radius:10px;padding:12px;background:var(--accent);color:white;font:inherit}.crop-actions button.secondary{background:var(--card2);border:1px solid var(--border);color:var(--text)}.crop-actions button:disabled{opacity:.5}\n</style>

    <div class="avatar" id="avatar">KS</div>
    <div>
      <h1>Kuper<span>Shop</span></h1>
      <a class="tg-link" href="https://t.me/djddjsbet" target="_blank">@djddjsbet</a>
    </div>
  </div>
  <button class="cart-btn" onclick="openCart()">Корзина <span class="badge" id="badge">0</span></button>
</header>

    <div class="age-actions">
      <button class="age-accept" type="button" onclick="confirmAdult()">Мне есть 18 лет</button>
      <button class="age-decline" type="button" onclick="declineAdult()">Мне нет 18 лет</button>
    </div>
    <div class="age-denied" id="ageDenied" role="status" hidden>Доступ к каталогу закрыт. Он предназначен только для совершеннолетних.</div>
  </div>
</div>

<script>
// Capture a referral code from ?ref=CODE and keep the first one on this device.
const REFERRAL_STORAGE_KEY = "kuper_referral_code_v1";
(function captureReferralCode() {
  try {
    const params = new URLSearchParams(window.location.search);
    const incoming = String(params.get("ref") || "").trim().toUpperCase();
    if (/^[A-Z0-9_-]{3,32}$/.test(incoming) && !localStorage.getItem(REFERRAL_STORAGE_KEY)) {
      localStorage.setItem(REFERRAL_STORAGE_KEY, incoming);
    }
  } catch (e) {
    console.warn("[KuperShop] Could not save referral code", e);
  }
})();

async function loadCatalog(){
  const grid=document.getElementById("grid");
  if(grid) grid.innerHTML = '<div class="empty">Загружаем каталог…</div>';
  try {
    const response=await fetch("/api/products",{method:"GET",cache:"no-store",headers:{"Accept":"application/json"}});
    const result=await response.json();
    if(!response.ok || !result.ok || !Array.isArray(result.products)) throw new Error(result.error||"Некорректный ответ каталога");
    const next=result.products.map(p=>({product_key:String(p.product_key),cat:p.category,brand:p.brand||"",name:p.name,price:Number(p.price),stock:Number(p.stock),image_url:p.image_url||""}));
    if(next.length!==781) console.warn("[KuperShop] Unexpected live catalog size:",next.length);
    if(next.some(p=>!p.product_key || !p.cat || !p.name || !Number.isFinite(p.price) || !Number.isFinite(p.stock))) throw new Error("В каталоге обнаружены некорректные товары");
    PRODUCTS=next;
    CATS=["Все",...Array.from(new Set(PRODUCTS.map(p=>p.cat)))];
    cart={};
    catalogLoadedFromSupabase=true;
    console.info("[KuperShop] Live catalog loaded:",PRODUCTS.length);
    renderCats(); renderGrid(); updateBadge();
  } catch(error) {
    console.error("[KuperShop] Live catalog load failed:",error);
    if(grid) grid.innerHTML='<div class="empty">Не удалось загрузить каталог. Обновите страницу или попробуйте позже.</div>';
    toast("Не удалось загрузить каталог");
  }
}

function renderHeader(){ document.querySelector("header h1").innerHTML = SETTINGS.shopName.replace("Shop","<span>Shop</span>"); const av = document.getElementById("avatar"); if(SETTINGS.avatar){ av.innerHTML = `<img src="${SETTINGS.avatar}" alt="">`; } else { av.textContent = SETTINGS.shopName.slice(0,2).toUpperCase(); av.style.background = "var(--accent)"; } }
function renderPromos(){ const el = document.getElementById("promos"); if(!SETTINGS.promos.length){ el.style.display="none"; return; } el.style.display="flex"; el.innerHTML = SETTINGS.promos.map((p)=>`<div class="promo" onclick="toast('Акция!')">${p.img?`<img src="${p.img}" alt="">`:``}<div class="promo-text">${escapeHtml(p.text)}</div></div>`).join(""); }
function renderCats(){ document.getElementById("cats").innerHTML = CATS.map(c=>`<div class="cat ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join(""); }
function brandColor(b){ let hash = 0; for (let i = 0; i < b.length; i++) hash = b.charCodeAt(i) + ((hash << 5) - hash); const c = (hash & 0x00FFFFFF).toString(16).toUpperCase(); return '#' + "00000".substring(0, 6 - c.length) + c; }
function renderGrid(){ const q=searchQuery.trim().toLocaleLowerCase("ru"); const list=PRODUCTS.map((p,index)=>({p,index})).filter(x=>(activeCat==="Все"||x.p.cat===activeCat)&&(!q||x.p.name.toLocaleLowerCase("ru").includes(q))); const el=document.getElementById("grid"); if(!list.length){ el.innerHTML=`<div class="empty">${q?"Ничего не найдено":"Нет товаров"}</div>`; return; } el.innerHTML=list.map(({p,index})=>{ const inCart=cart[index]||0; const avail=p.stock-inCart; const out=avail<=0; return `<div class="card" onclick="openProductView(${index})"><div class="thumb" style="background:${brandColor(p.brand)}">${p.image_url?`<img src="${escapeHtml(String(p.image_url))}" alt="${escapeHtml(p.name)}" loading="lazy">`:escapeHtml(p.brand)}</div><div class="card-body"><div class="name">${escapeHtml(p.name)}</div><div class="stock ${out?'out':''}">${out?'Нет в наличии':'В наличии: '+avail+' шт'}</div><div class="row"><div class="price">${p.price} ₽</div><button class="add" ${out?'disabled':''} onclick="event.stopPropagation();addToCart(${index})">${out?'Нет':'Купить'}</button></div></div></div>`; }).join(""); }
let selectedProductIndex=null;
function openProductView(index){
 const p=PRODUCTS[index];if(!p)return;selectedProductIndex=index;
 const body=document.getElementById("productSheetBody");
 const photo=p.image_url ? '<img src="' + escapeHtml(String(p.image_url)) + '" alt="' + escapeHtml(p.name) + '" style="width:100%;height:100%;object-fit:contain">' : '<div style="color:#aaa;font-size:14px">Фото пока не добавлено</div>';
 body.innerHTML='<div style="width:100%;height:min(55vh,440px);display:flex;align-items:center;justify-content:center;background:#171a20;border-radius:12px;overflow:hidden;margin-bottom:16px">' + photo + '</div><h3 style="font-size:18px;line-height:1.35;margin:0 0 10px">' + escapeHtml(p.name) + '</h3><div style="font-size:22px;font-weight:700">' + p.price + ' ₽</div>';
 const button=document.getElementById("productAddButton");const unavailable=(cart[index]||0)>=p.stock;button.disabled=unavailable;button.textContent=unavailable?"Нет в наличии":"Добавить в корзину";
 document.getElementById("overlay").classList.add("show");document.getElementById("productSheet").classList.add("show");
}
function closeProductView(){const sheet=document.getElementById("productSheet");if(sheet)sheet.classList.remove("show");if(selectedProductIndex!==null){const cartSheet=document.getElementById("cartSheet");if(!cartSheet.classList.contains("show"))document.getElementById("overlay").classList.remove("show");}selectedProductIndex=null;}
function addSelectedProductToCart(){if(selectedProductIndex===null)return;const i=selectedProductIndex;if((cart[i]||0)>=PRODUCTS[i].stock){toast("Больше нет");return;}cart[i]=(cart[i]||0)+1;updateBadge();renderGrid();closeProductView();toast("Добавлено");}
function setSearch(value){ searchQuery=value; renderGrid(); }
function setCat(c){ activeCat=c; renderCats(); renderGrid(); }
function addToCart(i){ if((cart[i]||0) >= PRODUCTS[i].stock){ toast("Больше нет"); return; } cart[i] = (cart[i]||0)+1; updateBadge(); renderGrid(); toast("Добавлено"); }
function updateBadge(){ document.getElementById("badge").textContent = Object.values(cart).reduce((a,b)=>a+b,0); }
function cartItems(){ return Object.keys(cart).map(i=>({i:+i, qty:cart[i], p:PRODUCTS[+i]})); }
function cartSum(){ return cartItems().reduce((s,x)=>s+x.p.price*x.qty,0); }
function openCart(){ renderCart(); document.getElementById("overlay").classList.add("show"); document.getElementById("cartSheet").classList.add("show"); }
function closeCart(){ document.getElementById("overlay").classList.remove("show"); document.getElementById("cartSheet").classList.remove("show"); }
function renderCart(){ const body = document.getElementById("cartBody"); const items = cartItems(); if(!items.length){ body.innerHTML = `<div class="empty">Корзина пуста</div>`; document.getElementById("totals").innerHTML = ""; document.getElementById("checkoutBtn").disabled = true; return; } document.getElementById("checkoutBtn").disabled = false; body.innerHTML = items.map(x=>`<div class="ci"><div class="ci-name">${escapeHtml(x.p.name)}<br><span style="color:var(--muted);font-size:11px">${x.p.price} ₽ × ${x.qty}</span></div><div class="qty"><button onclick="dec(${x.i})">−</button><span>${x.qty}</span><button onclick="inc(${x.i})">+</button></div><div class="ci-price">${x.p.price*x.qty} ₽</div></div>`).join("") + `<div class="delivery"><input type="checkbox" id="delivChk" ${deliveryOn?'checked':''} onchange="toggleDelivery(this)"><label for="delivChk">Доставка курьером — 199 ₽</label></div>`; renderTotals(); }
function toggleDelivery(el){ deliveryOn = el.checked; renderTotals(); }
function renderTotals(){ const sum = cartSum(); const del = deliveryOn && sum>0 ? 199 : 0; document.getElementById("totals").innerHTML = `<div class="line"><span>Товары</span><span>${sum} ₽</span></div><div class="line"><span>Доставка</span><span>${del} ₽</span></div><div class="line total"><span>Итого</span><span>${sum+del} ₽</span></div>`; }
function inc(i){ if(cart[i] < PRODUCTS[i].stock){ cart[i]++; renderCart(); renderGrid(); updateBadge(); } else toast("Больше нет"); }
function dec(i){ if(cart[i]>1) cart[i]--; else delete cart[i]; renderCart(); renderGrid(); updateBadge(); }
function showForm(){ closeCart(); const sum = cartSum(); const del = deliveryOn?199:0; const total = sum+del; document.getElementById("formBody").innerHTML = `<div class="field"><label>Имя</label><input id="fName" placeholder="Иван"></div><div class="field"><label>Телефон</label><input id="fPhone" placeholder="+7 900 000-00-00" type="tel"></div><div class="field"><label>Адрес доставки</label><input id="fAddr" placeholder="Улица, дом, квартира"></div><div style="font-size:14px;color:var(--muted);margin:12px 0">Товары: ${sum} ₽ · Доставка: ${del} ₽ · <b style="color:var(--text)">Итого: ${total} ₽</b></div><button class="btn-primary" onclick="submitOrder(${total})">Подтвердить заказ</button><div class="hint">Оплата — переводом курьеру при получении. Реквизиты появятся после оформления.</div>`; document.getElementById("overlay").classList.add("show"); document.getElementById("formSheet").classList.add("show"); }
function closeForm(){ document.getElementById("overlay").classList.remove("show"); document.getElementById("formSheet").classList.remove("show"); }
async function submitOrder(total){
 const name=document.getElementById("fName").value.trim();
 const phone=document.getElementById("fPhone").value.trim();
 const addr=document.getElementById("fAddr").value.trim();
 if(!name||!phone||!addr){toast("Заполните все поля");return;}
 const button=document.querySelector("#formBody .btn-primary");
 if(button){button.disabled=true;button.textContent="Отправляем...";}
 try{
  const payload={name,phone,address:addr,delivery:deliveryOn,referral_code:(()=>{try{return localStorage.getItem(REFERRAL_STORAGE_KEY)||"";}catch(e){return "";}})(),items:cartItems().map(x=>({product_key:x.p.product_key,quantity:x.qty}))};
  console.info("[KuperShop] Sending order", {itemCount:payload.items.length, origin:window.location.origin});
  const response=await fetch("https://kuper-shop.vercel.app/api/orders",{method:"POST",mode:"cors",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  const responseText=await response.text();
  let result={};

async function uploadAdminPromotionImage(id,input){
 const file=input.files&&input.files[0];if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast("Выберите JPG, PNG или WEBP");input.value="";return;}
 if(file.size>12*1024*1024){toast("Исходное фото должно быть меньше 12 МБ");input.value="";return;}
 try{
  const source=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});
  const img=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=reject;image.src=source;});
  const scale=Math.min(1,1600/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
  let encoded=canvas.toDataURL("image/jpeg",0.82).split(",")[1];if(encoded.length>2800000)encoded=canvas.toDataURL("image/jpeg",0.62).split(",")[1];if(encoded.length>2800000)throw new Error("Фото слишком большое");
  toast("Загружаем баннер…");const result=await adminRequest({action:"upload_promotion_image",mime_type:"image/jpeg",image_base64:encoded});
  document.getElementById("promoImage_"+id).value=result.image_url;toast("Изображение загружено — сохраните баннер");
 }catch(error){toast(error.message||"Не удалось загрузить баннер");}finally{input.value="";}
}

 const file=input.files&&input.files[0];if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast("Выберите JPG, PNG или WEBP");input.value="";return;}
 if(file.size>12*1024*1024){toast("Исходное фото должно быть меньше 12 МБ");input.value="";return;}
 const reader=new FileReader();
 reader.onload=()=>{const image=new Image();image.onload=()=>openProductCropEditor(key,image,input);image.onerror=()=>{toast("Не удалось открыть изображение");input.value="";};image.src=reader.result;};
 reader.onerror=()=>{toast("Не удалось прочитать фото");input.value="";};
 reader.readAsDataURL(file);
}
function openProductCropEditor(key,image,input){
 PRODUCT_CROP={key,image,input,zoom:1,x:0,y:0,dragging:false,lastX:0,lastY:0};
 const body=document.getElementById("adminBody");
 const modal=document.createElement("div");modal.id="productCropEditor";modal.className="crop-overlay";
 modal.innerHTML=`<div class="crop-dialog">
  <div class="crop-head"><strong>Кадрирование фото</strong><button type="button" onclick="closeProductCropEditor()">×</button></div>
  <p class="crop-hint">Так фото будет выглядеть в карточке товара. Перетаскивай изображение, чтобы выбрать нужную область.</p>
  <div class="crop-frame"><canvas id="productCropCanvas" width="600" height="400"></canvas></div>
  <div class="crop-zoom"><label for="productCropZoom">Масштаб</label><input id="productCropZoom" type="range" min="1" max="3" step="0.01" value="1" oninput="setProductCropZoom(this.value)"></div>
  <div class="crop-preview-label">Предпросмотр карточки каталога</div>
  <div class="crop-card-preview"><div class="crop-card-image"><canvas id="productCropThumb" width="300" height="200"></canvas></div><div class="crop-card-lines"><span></span><span></span><b>999 ₽</b></div></div>
  <div class="crop-actions"><button type="button" class="secondary" onclick="closeProductCropEditor()">Отмена</button><button type="button" onclick="saveProductCrop()">Сохранить фото</button></div>
 </div>`;
 body.appendChild(modal);
 const canvas=document.getElementById("productCropCanvas");
 canvas.onpointerdown=e=>{const c=PRODUCT_CROP;if(!c)return;c.dragging=true;c.lastX=e.clientX;c.lastY=e.clientY;canvas.setPointerCapture(e.pointerId);};
 canvas.onpointermove=e=>{const c=PRODUCT_CROP;if(!c||!c.dragging)return;const rect=canvas.getBoundingClientRect();c.x+=(e.clientX-c.lastX)*canvas.width/rect.width;c.y+=(e.clientY-c.lastY)*canvas.height/rect.height;clampProductCrop();c.lastX=e.clientX;c.lastY=e.clientY;drawProductCrop();};
 canvas.onpointerup=canvas.onpointercancel=()=>{if(PRODUCT_CROP)PRODUCT_CROP.dragging=false;};
 drawProductCrop();
}
function clampProductCrop(){const c=PRODUCT_CROP;if(!c)return;const scale=Math.max(600/c.image.width,400/c.image.height)*c.zoom;const dw=c.image.width*scale,dh=c.image.height*scale;c.x=Math.max((600-dw)/2,Math.min((dw-600)/2,c.x));c.y=Math.max((400-dh)/2,Math.min((dh-400)/2,c.y));}
function drawProductCrop(){
 const c=PRODUCT_CROP;if(!c)return;
 const image=c.image,canvas=document.getElementById("productCropCanvas"),thumb=document.getElementById("productCropThumb");if(!canvas||!thumb)return;
 const render=(target,multiplier)=>{
  const ctx=target.getContext("2d"),w=target.width,h=target.height;
  ctx.clearRect(0,0,w,h);ctx.fillStyle="#151820";ctx.fillRect(0,0,w,h);
  const base=Math.max(w/image.width,h/image.height)*c.zoom;
  const dw=image.width*base,dh=image.height*base;
  const x=(w-dw)/2+c.x*multiplier,y=(h-dh)/2+c.y*multiplier;
  ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();ctx.drawImage(image,x,y,dw,dh);ctx.restore();
 };
 render(canvas,1);render(thumb,.5);
}
function setProductCropZoom(value){if(!PRODUCT_CROP)return;PRODUCT_CROP.zoom=Number(value)||1;clampProductCrop();drawProductCrop();}
function closeProductCropEditor(){const el=document.getElementById("productCropEditor");if(el)el.remove();if(PRODUCT_CROP&&PRODUCT_CROP.input)PRODUCT_CROP.input.value="";PRODUCT_CROP=null;}
async function saveProductCrop(){
 const c=PRODUCT_CROP;if(!c)return;
 const output=document.createElement("canvas");output.width=1200;output.height=800;
 const ctx=output.getContext("2d"),image=c.image,base=Math.max(output.width/image.width,output.height/image.height)*c.zoom;
 const dw=image.width*base,dh=image.height*base;
 ctx.fillStyle="#151820";ctx.fillRect(0,0,output.width,output.height);
 ctx.drawImage(image,(output.width-dw)/2+c.x*2,(output.height-dh)/2+c.y*2,dw,dh);
 let encoded=output.toDataURL("image/jpeg",0.86).split(",")[1];
 if(encoded.length>2800000)encoded=output.toDataURL("image/jpeg",0.68).split(",")[1];
 if(encoded.length>2800000){toast("Фото слишком большое после сжатия");return;}
 const key=c.key,input=c.input;
 try{
  const buttons=document.querySelectorAll("#productCropEditor button");buttons.forEach(b=>b.disabled=true);
  toast("Загружаем фото…");
  await adminRequest({action:"upload_product_image",product_key:key,mime_type:"image/jpeg",image_base64:encoded});
  closeProductCropEditor();toast("Фото товара обновлено");await loadAdminProducts();loadCatalog();
 }catch(error){document.querySelectorAll("#productCropEditor button").forEach(b=>b.disabled=false);toast(error.message||"Не удалось загрузить фото");}
}
function filterAdminProducts(){ADMIN_PRODUCT_PAGE=0;renderAdminProducts(ADMIN_PRODUCTS);}
function changeAdminProductPage(delta){ADMIN_PRODUCT_PAGE=Math.max(0,ADMIN_PRODUCT_PAGE+delta);renderAdminProducts(ADMIN_PRODUCTS);}
async function saveAdminProduct(key){
 const val=id=>document.getElementById(id+"_"+key).value.trim();
 try{await adminRequest({action:"update_product",product_key:key,name:val("pname"),category:val("pcat"),brand:val("pbrand"),price:Number(val("pprice")),stock:Number(val("pstock"))});toast("Товар сохранён");await loadAdminProducts();}
 catch(error){toast(error.message||"Не удалось сохранить товар");}
}
async function setAdminProductActive(key,isActive){
 try{await adminRequest({action:"set_product_active",product_key:key,is_active:isActive});toast(isActive?"Товар возвращён в витрину":"Товар скрыт");await loadAdminProducts();}
 catch(error){toast(error.message||"Не удалось изменить видимость");}
}
async function createAdminProduct(){
 const payload={action:"create_product",name:document.getElementById("newPname").value.trim(),category:document.getElementById("newPcat").value.trim(),brand:document.getElementById("newPbrand").value.trim(),price:Number(document.getElementById("newPprice").value),stock:Number(document.getElementById("newPstock").value)};
 try{await adminRequest(payload);toast("Товар добавлен");await loadAdminProducts();}
 catch(error){toast(error.message||"Не удалось добавить товар");}
}

function adminLogout(){clearAdminToken();renderAdminLogin("Вы вышли из панели.");}
function handleAvatar(e){ const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev)=>{ SETTINGS.avatar = ev.target.result; }; reader.readAsDataURL(file); }
function delPromo(i){ SETTINGS.promos.splice(i,1); saveSettings(SETTINGS); renderAdmin(); }
function addPromo(){ const text = document.getElementById("aPromoText").value.trim(); const file = document.getElementById("aPromoImg").files[0]; if(!text){ toast("Введите текст"); return; } if(file){ const reader = new FileReader(); reader.onload = (ev)=>{ SETTINGS.promos.push({text, img: ev.target.result}); saveSettings(SETTINGS); renderAdmin(); }; reader.readAsDataURL(file); } else { SETTINGS.promos.push({text, img:""}); saveSettings(SETTINGS); renderAdmin(); } }
function saveAdmin(){ SETTINGS.shopName = document.getElementById("aName").value.trim() || "KuperShop"; SETTINGS.reqs = document.getElementById("aReqs").value.trim(); saveSettings(SETTINGS); toast("Сохранено!"); closeAdmin(); }
function toast(msg){ const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"), 2000); }
function escapeHtml(s){ return s.replace(/[&<>'"]/g, tag=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]||tag)); }
document.addEventListener("DOMContentLoaded", ()=>{ renderHeader(); renderPromos(); loadPromotions(); updateBadge(); if(hasAdultConfirmation()){ document.getElementById("ageGate").hidden=true; renderCats(); loadCatalog(); } else { showAgeGate(); } });
</script>
